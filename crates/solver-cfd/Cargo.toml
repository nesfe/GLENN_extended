[package]
name = "glenn-solver-cfd"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["nesfe"]

[dependencies]
glenn-core = { path = "../core" }
glenn-engine = { path = "../engine" }
glam = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
glenn-io = { path = "../io" }

[target."cfg(windows)".dependencies]
normpath = "1.5.2"
