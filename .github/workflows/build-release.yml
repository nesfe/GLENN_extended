name: Build, test and release

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-x11-0 libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Test resumable source downloads
        run: python3 -m unittest discover -s scripts -p test_release_sources.py

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-x11-0 libgl1-mesa-dev libvulkan1 mesa-vulkan-drivers xvfb
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: release-${{ matrix.platform }}
      - run: cargo test --locked --workspace --all-targets
      - run: cargo build --locked --release -p glenn-extended -p glenn-cli
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Render every page and a HiDPI narrow window
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WGPU_BACKEND: vulkan
        run: |
          # A few lattice steps are enough for layout; the expressive frames
          # below run the viscous field out properly.
          for page in 0 1 2 3 4 5 6 7 8; do
            timeout 60s xvfb-run -a -s '-screen 0 1600x1200x24' target/release/glenn-extended --screenshot "artifacts/screenshots/page-$page.png" --size 800x600 --page "$page" --native-steps 48
            timeout 60s xvfb-run -a -s '-screen 0 1600x1200x24' target/release/glenn-extended --screenshot "artifacts/screenshots/page-$page-bottom.png" --size 800x600 --page "$page" --scroll-end --native-steps 48
          done
          timeout 30s xvfb-run -a -s '-screen 0 1920x1080x24' target/release/glenn-extended --screenshot artifacts/screenshots/hidpi.png --size 1280x720 --scale 1.5
          test -s artifacts/screenshots/hidpi.png
          timeout 120s xvfb-run -a target/release/glenn-extended --screenshot artifacts/screenshots/viscous-tunnel.png --size 1440x900 --alpha 24 --native-steps 1500 --camera 1
          timeout 120s xvfb-run -a target/release/glenn-extended --screenshot artifacts/screenshots/viscous-section.png --size 1440x900 --alpha 24 --native-steps 1200 --page 8
          timeout 120s xvfb-run -a target/release/glenn-extended --screenshot artifacts/screenshots/native-3d.png --size 1440x900 --alpha 24 --native-steps 1200 --page 8 --native-3d
          test -s artifacts/screenshots/viscous-tunnel.png
          for input in tests/fixtures/profile.dxf tests/fixtures/cube.stl; do
            timeout 60s xvfb-run -a target/release/glenn-extended --screenshot "artifacts/screenshots/import-$(basename "$input").png" --input "$input" --size 1440x900
          done
          for alpha in -10 0 10 22; do
            timeout 90s xvfb-run -a -s '-screen 0 1920x1080x24' target/release/glenn-extended --screenshot "artifacts/screenshots/flow-$alpha.png" --size 1440x900 --alpha "$alpha" --camera 1
          done
      - name: Bundle native Windows CFD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/bundle_windows.py artifacts/package/runtime/openfoam
          Copy-Item target/release/glenn-extended.exe,target/release/glenn-cfd.exe artifacts/package/
          python scripts/test_bundled_cfd.py artifacts/package/glenn-cfd.exe tests/fixtures/cube.stl
      - name: Package Windows with CFD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/package | Out-Null
          Copy-Item target/release/glenn-extended.exe,target/release/glenn-cfd.exe artifacts/package/
          Copy-Item README.md,LICENSE artifacts/package/
          Copy-Item -Recurse docs artifacts/package/
          Copy-Item assets/fonts/LICENSE-DejaVu.txt artifacts/package/
          & "C:/Program Files/7-Zip/7z.exe" a -tzip -mx=5 "artifacts/GLENN-Extended-$env:VERSION-windows-x86_64.zip" ./artifacts/package/*
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse artifacts/package
          & "C:/Program Files/7-Zip/7z.exe" x -y "artifacts/GLENN-Extended-$env:VERSION-windows-x86_64.zip" '-oartifacts/Перенесённая программа'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test_bundled_cfd.py 'artifacts/Перенесённая программа/glenn-cfd.exe' tests/fixtures/cube.stl
      - name: Bundle native Linux CFD
        if: runner.os == 'Linux'
        run: |
          bash scripts/install_linux_solver.sh
          mkdir -p artifacts/package
          python3 scripts/bundle_linux.py /usr/lib/openfoam/openfoam2412 artifacts/package/runtime/openfoam
          cp target/release/glenn-cfd artifacts/package/
          # Prove the archive stands alone: remove the install before running it.
          sudo apt-get remove -y openfoam2412 openfoam2412-common
          python3 scripts/test_bundled_cfd.py artifacts/package/glenn-cfd tests/fixtures/cube.stl
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/package
          cp target/release/glenn-extended target/release/glenn-cfd README.md LICENSE assets/fonts/LICENSE-DejaVu.txt artifacts/package/
          cp -r docs artifacts/package/
          tar -czf "artifacts/GLENN-Extended-$VERSION-linux-x86_64.tar.gz" -C artifacts/package .
          rm -rf artifacts/package
          mkdir -p 'artifacts/Перенесённая программа'
          tar -xzf "artifacts/GLENN-Extended-$VERSION-linux-x86_64.tar.gz" -C 'artifacts/Перенесённая программа'
          python3 scripts/test_bundled_cfd.py 'artifacts/Перенесённая программа/glenn-cfd' tests/fixtures/cube.stl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.platform }}
          path: |
            artifacts/GLENN-Extended-*.zip
            artifacts/GLENN-Extended-*.tar.gz
            artifacts/GLENN-Extended-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: ui-screenshots
          path: artifacts/screenshots/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          path: artifacts/release
          merge-multiple: true
      - name: Mirror corresponding solver sources
        run: python3 scripts/release_sources.py artifacts/release
      - name: Publish version after every platform passed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag must match Cargo.toml version' >&2
            exit 1
          fi
          # Published versions are immutable. Bump Cargo.toml + Cargo.lock for the next release.
          if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" == false ]]; then
              echo "$tag is already published; nothing to do."
              exit 0
            fi
            # Do not replace a draft created from a different commit.
            target=$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')
            test "$target" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "GLENN Extended $tag" --notes-file docs/RELEASE.md --draft
          fi
          cd artifacts/release
          sha256sum GLENN-Extended-* OpenFOAM-* ThirdParty-* > SHA256SUMS.txt
          gh release upload "$tag" ./* --clobber
          if [[ "$version" == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --draft=false --latest
          fi
