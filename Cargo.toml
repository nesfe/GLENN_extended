[workspace]
members = [".", "crates/*"]
resolver = "2"

[package]
name = "glenn-extended"
version = "4.0.0-beta.2"
edition = "2024"
rust-version = "1.88"
authors = ["nesfe"]
license = "MIT"
description = "Native aerodynamic workbench with a cached Hess–Smith panel solver"
repository = "https://github.com/nesfe/GLENN_extended"

[dependencies]
glenn-solver-native = { path = "crates/solver-native" }
glenn-core = { path = "crates/core" }
glenn-solver-panel = { path = "crates/solver-panel" }
glenn-io = { path = "crates/io" }
glenn-engine = { path = "crates/engine" }
glenn-solver-cfd = { path = "crates/solver-cfd" }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
cpal = { version = "0.15", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles", "dx12", "metal"] }

[features]
default = ["audio"]
# Tunnel audio needs a system sound library (ALSA headers on Linux). Numerics,
# file formats and their tests build and run without it.
audio = ["dep:cpal"]

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

# The live numerical loop must also run interactively in development builds.
[profile.dev.package.glenn-solver-native]
opt-level = 3
