[package]
name = "glenn-extended"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["nesfe"]
license = "MIT"
description = "Native aerodynamic workbench with a cached Hess–Smith panel solver"
repository = "https://github.com/nesfe/GLENN_extended"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
